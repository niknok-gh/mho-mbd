<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPANG MHO</title>

  </head>

<body>
    <h1>Forgot your password?</h1>

    <form id="forgot-form" novalidate>
      <p class="subtitle">Enter the email you signed up with and we'll send you a six digit code to reset your password.</p>
      <div class="field">
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" name="email" autocomplete="email" placeholder="you@example.com">
        <div class="error-msg"></div>
      </div>

      <button type="submit" class="btn">Send code</button>
      <div class="form-status" aria-live="polite"></div>
    </form>

    <form id="code-form" novalidate hidden>
      <p class="subtitle">We sent a six digit code to your email. It expires in 10 minutes.</p>
      <div class="field">
        <label for="otp1">Enter code</label>
        <input type="text" id="otp1" class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code" placeholder="1">
        <input type="text" id="otp2" class="otp-box" maxlength="1" inputmode="numeric" placeholder="2">
        <input type="text" id="otp3" class="otp-box" maxlength="1" inputmode="numeric" placeholder="3">
        <input type="text" id="otp4" class="otp-box" maxlength="1" inputmode="numeric" placeholder="4">
        <input type="text" id="otp5" class="otp-box" maxlength="1" inputmode="numeric" placeholder="5">
        <input type="text" id="otp6" class="otp-box" maxlength="1" inputmode="numeric" placeholder="6">
        <div class="error-msg"></div>
      </div>

      <button type="submit" class="btn">Verify code</button>
      <button type="button" id="resend-btn">Resend code</button>
      <div class="form-status" aria-live="polite"></div>
    </form>

    <form id="reset-form" novalidate hidden>
      <p class="subtitle">Code accepted. Choose a new password.</p>
      <div class="field">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" name="password" autocomplete="new-password" placeholder="New password">
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" placeholder="Confirm new password">
        <div class="error-msg"></div>
      </div>

      <button type="submit" class="btn">Reset password</button>
      <div class="form-status" aria-live="polite"></div>
    </form>

    <a class="back" href="signin.html">&larr; Back to log in</a>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
