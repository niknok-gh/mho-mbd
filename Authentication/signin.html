<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jose Panganiban MHO</title>

    <link rel="stylesheet" href="style2.css">

</head>
<body>
    <section class="container forms">
        <div class="container">
            <div>
             <img id="web-logo" src="/Media/MHO Logo.png" alt="JPANG MHO" class="form-logo">
             <h1>Welcome Back!</h1>
             <p>Sign in to register in local mass blood donation programs</p>

                <form id="login-form" class="active" novalidate>
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" autocomplete="email" placeholder="you@example.com">
                        <div class="error-msg"></div>
                    </div>

                    <div class="field">
                        <label for="login-password">Password</label>
                        <div class="password-wrap">
                            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Your password">
                            <button type="button" class="toggle-pw">Show</button>
                        </div>
                        <div class="error-msg"></div>
                    </div>

                    <div class="row">
                        <label><input type="checkbox" id="remember"> Remember me</label>
                        <a href="forgot-password.html">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn">Log in</button>
                    <div class="form-status" aria-live="polite"></div>
                </form>

                <p>No account yet? <a href="create-account1.html">Create one</a></p>
            </div>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="signin.js"></script>
</body>

</html>
