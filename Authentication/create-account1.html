<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jose Panganiban MHO</title>

    <link rel="stylesheet" href="style1.css">

</head>
<body>
    <section class="container forms">
        <div class="container">
             <img id="web-logo" src="/Media/MHO Logo.png" alt="JPANG MHO" class="form-logo">
             <h1>Become a Blood Donor!</h1>
             <p>Participate in local mass blood donation programs </p>
                <form id="step1-form" novalidate>
                    <div>
                        <h2>Create Account</h2>
                        <p>Sign up to register in mass blood donation programs</p>
                    </div>

                    <div>
                        <div class="label"><label for="firstname">First Name:</label><br><br></div>
                        <input type="text" id="firstname" name="firstname" autocomplete="given-name" placeholder="John" required>
                    </div>
                    <div>
                        <div class="label"><label for="lastname">Last Name:</label><br><br></div>
                        <input type="text" id="lastname" name="lastname" autocomplete="family-name" placeholder="Doe" required>
                    </div>

                    <div>
                        <div class="label"><label for="middlename">Middle Name:</label><br><br></div>
                        <input type="text" id="middlename" name="middlename" placeholder="(if applicable)">
                        <br><br>
                    </div>

                    <div>
                        <div class="label"><label for="name_extension">Name Extension:</label><br><br></div>
                        <input type="text" id="name_extension" name="name_extension" placeholder="(if applicable)">
                        <br><br>
                    </div>

                    <div>
                        <div class="label"><label for="age">Age:</label><br><br></div>
                        <input type="text" id="age" name="age" inputmode="numeric" placeholder="Age" required>
                       <br><br>
                    </div>

                    <div>
                        <div class="label"><label for="sex">Sex:</label><br><br></div>
                        <input type="text" id="sex" name="sex" placeholder="Sex" required>
                        <br><br>
                    </div>

                    <div>
                        <div class="label"><label for="address">Address:</label><br><br></div>
                        <input type="text" id="address" name="address" autocomplete="street-address" placeholder="Address" required>
                        <br><br>
                    </div>

                    <div>
                        <div class="label"><label for="birthdate">Birthdate:</label><br><br></div>
                        <input type="date" id="birthdate" name="birthdate" required>
                        <br><br>
                    </div>

                    <div>
                        <div class="label"><label for="blood_type">Blood Type:</label><br><br></div>
                        <select id="blood_type" name="blood_type" required>
                            <option value="Not yet tested">Not yet tested</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div>
                        <br><br>
                        <button type="submit" id="next-btn">Next</button>
                        <div class="form-status" id="form-status" aria-live="polite"></div>
                    </div>

                    <p>Already have an account? <a href="signin.html">Log in</a></p>
                </form>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="create-account1.js"></script>
</body>

</html>
