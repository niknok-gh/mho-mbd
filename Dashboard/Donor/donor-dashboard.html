<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHO Jose Panganiban</title>
    <link rel="icon" type="image/x-icon" href="/Media/MHO Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        /* GENERAL */
        * {
            /* Disables text selection */
            -webkit-user-select: none; /* Chrome, Safari, Edge */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* Older IE */
            user-select: none;
        }
        img {
            /* Disables image dragging and selection */
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;
        }
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 70px;
        }
        body {
            margin: 0px;
            padding: 0px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu,'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f6fff9;
        }
        /* HEADER AND NAVIGATION BAR */
        header {
            display: flex;
            flex-direction: row;
            position: sticky;
            z-index: 99;
            top: 0;
            background-color: #f7faf7;
            padding: .5rem min(10rem, 2%);
            box-shadow: 0px 5px 30px rgba(0, 0, 0, 0.15);
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: start;
            gap: 1.5rem;
            max-width: 100%;
            overflow: hidden;
        }
        .header-container button {
            color: #263b31;
            border: none;
            background-color: transparent;
            transition: 250ms ease;
        }
        .header-container button:hover {
            color: #16845b;
        }
        .header-logo {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: left;
            min-width: 20rem;
        }
        .header-image {
            width: 100%;
            max-width: 2.5rem;
            max-height: 2.5rem;
        }
        .header-text {
            display: flex;
            flex-direction: column;
            color: #263b31;
            margin-left: 10px;
            padding: 0;
        }
        .header-text h1 {
            font-size: 1rem;
            margin-bottom: 0;
        }
        .header-text p {
            font-size: 0.6rem;
            margin-top: 0;
        }
        /* HAMBURGER MENU */
        .sidebar {
            position: fixed;
            margin: 0px;
            padding: 2rem 1rem 2rem 1rem;
            left: 0;
            z-index: 999;
            height: 100dvh;
            width: 250px;
            background-color: #f7faf7;
            backdrop-filter: blur(50px);
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
            gap: 2rem;
            transform: translateX(0);

            transition: 250ms ease-in-out;
        }
        .sidebar.hide {
            transform: translateX(-100%);
        }
        .sidebar-profile {
            display: flex;
            justify-content: start;
            align-items: center;
            gap: 0.5rem;
            margin: 0px;
            width: 90%;
            border-radius: 12px;
            background: linear-gradient(#263b31, #16845b);
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.13);
            padding: 0.25rem 1rem 0.25rem 1rem;
        }
        .sidebar-profile img {
            width: 15%;
            border-radius: 100px;
            border: solid 2px #f7faf780;
        }
        .sidebar-profile p {
            color: #f7faf7;
            font-weight: 500;
        }

        /* MEDIA QUERIES */

        /* Large Desktop Screen */
        @media (max-width: 1600px) {
            
        }
        /* Small Laptop Screen */
        @media (max-width: 1199px) {

        }
        /* Tablet Screen */
        @media (max-width: 1023px) {
            
        }
        /* Mobile Screen (Landscape) */
        @media (max-width: 992px) {
            header {
                padding: .5rem min(10rem, 3%);
            }
        }
        /* Mobile Screen (Landscape) */
        @media (max-width: 767px) {
            
        }
        /* Mobile Screen (Portrait) */
        @media (max-width: 576px) {

        }

        /* ANIMATIONS */
        .fade-in {
            opacity: 0;
            transform: translateY(100px);
        }
        .fade-in.show {
            animation: fade-in-motion 250ms ease forwards;
        }
        @keyframes fade-in-motion {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <button id="toggle-sidebar" class="menu-button" aria-label="Toggle sidebar" aria-expanded="false">
                <i class="fa-solid fa-bars" style="transform: scale(1.5)"></i>
            </button>
            <div class="header-logo">
                <img class="header-image" src="/Media/MHO Logo.png" alt="MHO Logo">
                <div class="header-text">
                    <h1>Municipal Health Office</h1>
                    <p>Jose Panganiban, Camarines Norte</p>
                </div>
            </div>
        </div>
    </header>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-profile">
            <img src="/Media/User Profile.png" alt="Profile Picture">
            <p>John Doe</p>
        </div>
    </div>
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleButton = document.getElementById('toggle-sidebar');

        toggleButton.addEventListener('click', () => {

            sidebar.classList.toggle('hide');

            const isOpen = !sidebar.classList.contains('hide');

            toggleButton.setAttribute('aria-expanded', isOpen);

        });
    </script>
</body>
</html>
